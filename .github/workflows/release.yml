name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release --bin potoo-potigol
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          bundle="potoo-potigol-interpreter-${version}-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "target/release/potoo-potigol" "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.tag || github.ref_name }}"
          $bundle = "potoo-potigol-interpreter-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/release/potoo-potigol.exe" -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: potoo-potigol-interpreter-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "potoo-potigol-interpreter $tag" \
              --notes "The platform archives contain only the compiled CLI executable. Verify downloads with SHA256SUMS. GitHub source snapshots are separate and are not executable packages."
          fi
