name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release --bin potoo-potigol
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          bundle="potoo-potigol-interpreter-${version}-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "target/release/potoo-potigol" "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          }
          $bundle = "potoo-potigol-interpreter-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/release/potoo-potigol.exe" -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: potoo-potigol-interpreter-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Potigol interpreter $tag" \
              --notes "Initial standalone binary release of the Potigol Rust interpreter and CLI. Supported targets: Linux x86_64 (GNU), Windows x86_64 (MSVC), and macOS Intel (x86_64). Apple silicon is not supported in this version. Each archive contains only the compiled CLI executable. See README.md for installation and usage; verify downloads with SHA256SUMS. GitHub source snapshots are separate from these binary packages."
          fi
