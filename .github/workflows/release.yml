name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release --bin potoo-potigol
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bundle="potoo-potigol-interpreter-${version}-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "target/release/potoo-potigol" "$bundle/"
          cp README.md LICENSE "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $bundle = "potoo-potigol-interpreter-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/release/potoo-potigol.exe", "README.md", "LICENSE" -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: potoo-potigol-interpreter-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.tar.gz *.zip SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "potoo-potigol-interpreter $GITHUB_REF_NAME" \
              --generate-notes
          fi
